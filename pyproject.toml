[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optionchain-cli"
version = "1.3.0"
description = "Beginner-friendly CLI + GUI for stock option chains, PCR, history charts, and ITM vs OTM research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hanson" }]
keywords = ["options", "option-chain", "stocks", "cli", "yahoo-finance", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.0.0",
  "rich>=13.0.0",
  "tabulate>=0.9.0",
  "curl-cffi>=0.7.0",
  "requests>=2.31.0",
  "matplotlib>=3.8.0",
  "plotext>=5.3.2",
  "customtkinter>=6.0.0",
  "pyinstaller>=6.21.0",
]

[project.scripts]
optionchain = "optionchain.cli:main"
optionchain-gui = "optionchain.gui:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["optionchain"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
